name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Postgres descartável para os testes marcados `postgres` (mesma tag do compose).
    # As senhas só valem dentro do job: não são segredo.
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: ci-descartavel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BRASILEIRAO_PG_TESTE_URL: postgresql://postgres:ci-descartavel@localhost:5432/postgres
      PG_SENHA_CARGA: ci-carga-descartavel
      PG_SENHA_LEITOR: ci-leitor-descartavel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      # O configure_spark_with_delta_pip baixa via Ivy os jars do Delta e o driver JDBC.
      - name: Versões do delta-spark e do driver JDBC
        id: jars
        run: |
          delta=$(awk '/^name = "delta-spark"$/ { getline; gsub(/version = |"/, ""); print }' uv.lock)
          jdbc=$(sed -n 's/^DRIVER_JDBC = "org\.postgresql:postgresql:\(.*\)"$/\1/p' src/brasileirao/serving/tabelas.py)
          test -n "$delta" && test -n "$jdbc"
          echo "delta=$delta" >> "$GITHUB_OUTPUT"
          echo "jdbc=$jdbc" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.ivy2.5.2
          key: ivy-delta-${{ runner.os }}-${{ steps.jars.outputs.delta }}-pg-${{ steps.jars.outputs.jdbc }}
      - run: make test
