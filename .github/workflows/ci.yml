name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: make lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-groups --locked
      # O configure_spark_with_delta_pip baixa os jars do Delta via Ivy na primeira sessão.
      - name: Versão do delta-spark no uv.lock
        id: delta
        run: |
          versao=$(awk '/^name = "delta-spark"$/ { getline; gsub(/version = |"/, ""); print }' uv.lock)
          echo "versao=$versao" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.ivy2.5.2
          key: ivy-delta-${{ runner.os }}-${{ steps.delta.outputs.versao }}
      - run: make test
