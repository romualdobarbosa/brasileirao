[project]
name = "brasileirao"
version = "0.1.0"
description = "Lakehouse do Campeonato Brasileiro em PySpark e Delta Lake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "delta-spark==4.4.1",
    "kagglehub>=1.0.3",
    "psycopg[binary]>=3.3.6",
    "pyspark==4.2.0",
]

[dependency-groups]
app = [
    "altair==6.3.0",
    "pandas==2.3.3",
    "pyarrow==26.0.0",
    "streamlit==1.66.1",
]
dev = [
    "chispa>=0.12.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs: teste pulado aparece com o motivo (ex.: os `postgres` sem BRASILEIRAO_PG_TESTE_URL).
addopts = "-rs"
markers = [
    "postgres: precisa de um Postgres real em BRASILEIRAO_PG_TESTE_URL (pulado sem ela)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
