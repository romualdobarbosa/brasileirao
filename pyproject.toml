[project]
name = "brasileirao"
version = "0.1.0"
description = "Lakehouse do Campeonato Brasileiro em PySpark e Delta Lake"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "delta-spark==4.4.1",
    "kagglehub>=1.0.3",
    "pyspark==4.2.0",
]

[dependency-groups]
dev = [
    "chispa>=0.12.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
